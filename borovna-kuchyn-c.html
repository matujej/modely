const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }

    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];

    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)

    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);

// Malířovo pořadí z kvádrů: každá položka má osově zarovnaný kvádr [x0,y0,z0,x1,y1,z1] ve světě.
// Pohled míří od +x,+y,+z. A se kreslí před B (A je za B), když je A na nižší straně B aspoň v jedné ose
// a v žádné ose naopak. Překrývající se obrazovkové obdélníky rozhodují, zda se pár vůbec řeší.
function screenBox(box, project) {
  const [x0, y0, z0, x1, y1, z1] = box;
  let l = 1e9, t = 1e9, r = -1e9, b = -1e9;
  for (let i = 0; i < 8; i++) {
    const [sx, sy] = project([i & 1 ? x1 : x0, i & 2 ? y1 : y0, i & 4 ? z1 : z0]);
    if (sx < l) l = sx;
    if (sx > r) r = sx;
    if (sy < t) t = sy;
    if (sy > b) b = sy;
  }
  return [l, t, r, b];
}

const EPS = 0.02;
function relation(a, b) {
  // 1: a před b (a se kreslí dřív), -1: b před a, 0: bez omezení
  let ab = false;
  let ba = false;
  for (let i = 0; i < 3; i++) {
    if (a[i + 3] <= b[i] + EPS) ab = true;
    if (b[i + 3] <= a[i] + EPS) ba = true;
  }
  if (ab && !ba) return 1;
  if (ba && !ab) return -1;
  return 0;
}

// items: [{ box, sb: screenBox, key }]; vrací pole indexů v pořadí kreslení.
function paintOrder(items) {
  const n = items.length;
  const before = Array.from({ length: n }, () => []); // before[j] = položky, které se musí kreslit před j
  for (let i = 0; i < n; i++) {
    const A = items[i];
    for (let j = i + 1; j < n; j++) {
      const B = items[j];
      if (A.sb[2] <= B.sb[0] || B.sb[2] <= A.sb[0] || A.sb[3] <= B.sb[1] || B.sb[3] <= A.sb[1]) continue;
      const r = relation(A.box, B.box);
      if (r === 1) before[j].push(i);
      else if (r === -1) before[i].push(j);
    }
  }
  const idx = items.map((_, i) => i).sort((p, q) => items[p].key - items[q].key || p - q);
  const state = new Uint8Array(n);
  const out = [];
  const visit = (i) => {
    if (state[i]) return;
    state[i] = 1;
    for (const j of before[i]) visit(j);
    state[i] = 2;
    out.push(i);
  };
  for (const i of idx) visit(i);
  return out;
}

  const wrap = (mat, inner) => (mat ? `<g class="m-${mat}">${inner}</g>` : inner);

  // rovinná plocha s lokálními souřadnicemi (u, v, t): t je po normále
  const faceOf = (o, eu, ev, n) => ({ p: (u, v, t = 0) => add(o, add(mul(eu, u), add(mul(ev, v), mul(n, t)))), n });
  const poly = (F, pts, t = 0) => k.pathOf(pts.map(([u, v]) => at(F.p(u, v, t))), true);

  const L = (d, tone = "lo", o = {}) => k.lineSvg(d, { tone, ...o });

    const bw = Math.max(...us) - Math.min(...us); const bh = Math.max(...vs) - Math.min(...vs);

    corner(x0 + a, y0 + a, a, Math.PI); corner(x1 - b, y0 + b, b, -Math.PI / 2); corner(x1 - c, y1 - c, c, 0); corner(x0 + d, y1 - d, d, Math.PI / 2);
    // pořadí rohů: (xmin,ymin) -> (xmax,ymin) -> (xmax,ymax) -> (xmin,ymax)

  {

    W([2200, -120, 0, 3000, 0, 1830], "stěna západ 3a"); W([2200, -120, 2500, 3000, 0, 2620], "stěna západ 3b");

    // okno 6 × 2 tabulek v otvoru x 1000–3000, z 1830–2500

      const bars = [];

      }

      let g = "";

      for (let i = 1; i < 10; i++) { const z = 930 + RH * i; if (i < 6) seg(pt(0, z), pt(2500, z)); else if (i === 6) { seg(pt(0, z), pt(612, z)); seg(pt(612, z), pt(1312, z)); seg(pt(1312, z), pt(2500, z)); } else seg(pt(612, z), pt(1312, z)); }
      for (let i = 0; i < 10; i++) {
        const z0 = 930 + RH * i, z1 = z0 + RH, off = (i % 2) * (TL / 2);

  }

  return { statics: S, elements: E };
}

// Živá část: náhodná sada otevřených dvířek a šuplíků, pružinový pohyb, přeřazení podle hloubky po snímcích.
